name: Build, Push & Deploy Application

on:
    push:
        branches:
            - main

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:

            - name: Checkout repositories
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
            
            - name: Show API context files
              run: ls - la Server/MagicStreamServer || true

            - name: Show Web context files
              run: ls - la Server/MagicStreamServer || true

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Extract Docker metdadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                images:
                    velarin/magic-stream-api-prod
                    velarin/magic-stream-web-prod
                tags:
                    type=sha, formart=short
                    type=raw, value=latest

            - name: Build & push API image
              uses: docker/build-push-action@v6
              with:
                context: Server/MagicStreamServer
                file: Server/MagicStreamServer/Dockerfile.prod
                push: true
                tags: |
                    velarin/magic-stream-api-prod:${{ github.sha }}
                    velarin/magic-stream-api-prod:latest

